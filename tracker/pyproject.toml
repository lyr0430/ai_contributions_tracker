[tool.poetry]
name = "ai-tracker"
version = "0.1.0"
description = "AI Code Contribution Tracker - Track and analyze AI-generated code contributions"
authors = ["Your Name <your.email@example.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/yourusername/ai-tracker"
repository = "https://github.com/yourusername/ai-tracker"
keywords = ["ai", "code-contribution", "claude-code", "tracking", "analysis"]

[tool.poetry.dependencies]
python = "^3.8"

[tool.poetry.dev-dependencies]
pytest = "^7.0.0"
pytest-cov = "^4.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["ai_tracker/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=ai_tracker --cov-report=term-missing"

[tool.poetry.scripts]
ai-tracker = "ai_tracker.__main__:main"
