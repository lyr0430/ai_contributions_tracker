[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "ai-contributions-server"
version = "0.1.0"
description = "AI Contribution Storage Server"
requires-python = ">=3.8"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "sqlmodel>=0.0.14",
    "aiosqlite>=0.19.0",
]

[project.scripts]
ai-server = "server.__main__:main"

[tool.setuptools.packages.find]
include = ["server*"]
